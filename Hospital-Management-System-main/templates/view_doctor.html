{% extends 'home.html' %}

{% block content %}

<div class="mt-2 d-flex justify-content-center align-items-center">
   <div class="table-responsive shadow rounded w-75 bg-primary">
        <h2 class="text-center text-white">Doctor list <span class="bi bi-person-fill"></span></h2>
     <table class="table table-hover table-bordered table-striped align-middle text-center">
         <thead class="table-dark">
             <tr>
                <th scope="col" class="fs-4">DoctorId</th>
                <th scope="col" class="fs-4">DoctorName</th>
                <th scope="col" class="fs-4">DoctorDepartement</th>
                <th scope="col" class="fs-4">EDIT DOCTOR DETAILS</th>
                <th scope="col" class="fs-4">DELETE DOCTOR DETAILS</th>
             </tr>
         </thead>
         <tbody>
            {% for row in doc %}
               <tr>
                   <td class="fw-bold bg-secondary text-white" >{{row.DoctorId}}</td>
                   <td class="fw-bold bg-secondary text-white">{{row.DoctorName}}</td>
                   <td class="fw-bold bg-secondary text-white">{{row.DoctorDepartement}}</td>
                   <td class="fw-bold bg-secondary " ><button class="btn btn-outline-warning w-100 btn-outline-success "><a class="text-decoration-none p-4 text-white fw-bold fs-6" href="{% url 'editdoctor' row.DoctorId %}">Edit Doctor</a></button></td>
                   <td class="fw-bold bg-secondary " ><button class="btn btn-outline-danger w-100 btn-outline-primary"><a class="text-decoration-none p-4 text-white fw-bold fs-6" href="{% url 'deletedoctor' row.DoctorId %}">Delete Doctor</a></button></td>
               </tr>
            {%endfor%}
         </tbody>
     </table>
   </div>
</div>

{% endblock %}
