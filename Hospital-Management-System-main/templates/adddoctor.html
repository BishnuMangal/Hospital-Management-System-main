{% extends 'home.html' %}
{% block content %}

<div class="d-flex align-items-center justify-content-center mt-4">

    <form method="POST" class="bg-warning p-4 rounded shadow-lg w-100 " style="max-width: 500px;">
        {% csrf_token %}

        <h2 class="text-center mb-3">Add Doctor Detail <span class="bi bi-person-fill"></span></h2>
        <div class="mb-3">
            <label for="dId" class="fw-bold form-label">Doctor Id</label>
            <input type="text"
                id="dId"
                maxlength="3"
                name="DoctorId"
                title="Id must be 3 digit"
                placeholder="Enter the doctor id"
                pattern="\d{3}"
                required
                class="form-control"
                >
        </div>
        <div class="mb-3">
           <label for="Dname" class="form-label fw-bold">Doctor Name</label>
           <input type="text"
            name="DoctorName"
            maxlength="50"
            title="Name must contain only letter and spaace"
            placeholder="Enter the doctor naame"
            required
            class="form-control">

        </div>

        <div class="mb-3">
           <label for="Dpartement" class="form-label fw-bold">Doctor Departement</label>
           <input type="text"
            id="Dpartement"
            name="DoctorDepartement"
            maxlength="50"
            title="Name must contain only letter and spaace"
            placeholder="Enter the doctor departement "
            required
            class="form-control">

        </div>
    <div class="text-center">
      <button type="submit" class="btn btn-dark w-25 fw-bold ">Save</button>
    </div>

  
    {% if msg %}
    <div class="alert alert-success mt-3 text-center">
      {{ msg }}
    </div>
    {% endif %}

    </form>    
      
</div>
{% endblock %}
