{% extends 'home.html' %}

{% block content %}
<div class="container-fluid d-flex align-items-center justify-content-center min-vh-100 py-4 ">
  <div class="row justify-content-center w-100">
    <div class="col-12 col-md-8 col-lg-6 col-xl-5">
      <form method="POST" class="bg-white border border-2 rounded-3 p-3 p-md-4 shadow">
        {% csrf_token %}
        <h2 class="text-center text-dark fw-bold mb-4">
          EDIT DOCTOR DETAILS <span class="bi bi-person-fill"></span>
        </h2>

        <div class="mb-3">
          <label class="form-label fw-bold">
            <span class="bi bi-card-text me-2"></span>
            DOCTOR ID
          </label>
          <input class="form-control bg-secondary text-white fw-bold" 
                 name="id" 
                 type="text" 
                 value="{{ doctor.DoctorId }}" 
                 readonly>
        </div>

        <div class="mb-3">
          <label class="form-label fw-bold">
            <span class="bi bi-person-plus me-2"></span>
            ENTER NEW NAME
          </label>
          <input class="form-control fw-bold" 
                 name="Name" 
                 type="text" 
                 value="{{ doctor.DoctorName}}" 
                 required>
        </div>

        <div class="mb-4">
          <label class="form-label fw-bold">
            <span class="bi bi-telephone-plus me-2"></span>
            ENTER NEW DEPARTMENT
          </label>
          <input class="form-control fw-bold" 
                 name="DEP" 
                 type="text" 
                 value="{{ doctor.DoctorDepartement}}" 
                 required>
        </div>

        <div class="d-grid">
          <button type="submit" class="btn btn-warning fw-bold py-2">
            UPDATE DOCTOR
          </button>
        </div>
      </form>
    </div>
  </div>
</div>
{% endblock %}
